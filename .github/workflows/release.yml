name: Release Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        id: set-version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Update version in package.json
        run: |
          $version = "${{ env.VERSION }}"
          $package = Get-Content package.json | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Update version in tauri.conf.json
        run: |
          $version = "${{ env.VERSION }}"
          $tauri = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows exe
        run: |
          Compress-Archive -Path "src-tauri/target/release/tauri-app.exe" -DestinationPath "tauri-app-${{ env.VERSION }}-windows-x64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            tauri-app-${{ env.VERSION }}-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update version in package.json
        run: |
          version="${{ env.VERSION }}"
          node -e "const pkg=require('./package.json'); pkg.version='$version'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2))"

      - name: Update version in tauri.conf.json
        run: |
          version="${{ env.VERSION }}"
          node -e "const tauri=require('./src-tauri/tauri.conf.json'); tauri.version='$version'; require('fs').writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux exe
        run: |
          tar -czvf tauri-app-${{ env.VERSION }}-linux-x64.tar.gz -C src-tauri/target/release/ tauri-app

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            tauri-app-${{ env.VERSION }}-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update version in package.json
        run: |
          version="${{ env.VERSION }}"
          node -e "const pkg=require('./package.json'); pkg.version='$version'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2))"

      - name: Update version in tauri.conf.json
        run: |
          version="${{ env.VERSION }}"
          node -e "const tauri=require('./src-tauri/tauri.conf.json'); tauri.version='$version'; require('fs').writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS exe
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" "tauri-app-${{ env.VERSION }}-macos-arm64.app"
            tar -czvf tauri-app-${{ env.VERSION }}-macos-arm64.tar.gz "tauri-app-${{ env.VERSION }}-macos-arm64.app"
            rm -rf "tauri-app-${{ env.VERSION }}-macos-arm64.app"
          else
            echo "No .app bundle found"
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            tauri-app-${{ env.VERSION }}-macos-arm64.tar.gz

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: ./linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./macos

      - name: List all artifacts
        run: find . -type f -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.dmg"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/**/*.exe
            windows/**/*.msi
            windows/**/*.zip
            linux/**/*.deb
            linux/**/*.AppImage
            linux/**/*.tar.gz
            macos/**/*.dmg
            macos/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
